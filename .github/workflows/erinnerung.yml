name: Erinnerung 22 Uhr

# Zeitplan abgeschaltet (21.10.2026): GitHub startete die Abendläufe bis zu drei Stunden zu spät.
# Die tägliche Erinnerung kommt jetzt über eine Kurzbefehle-Automation auf dem iPhone (ANLEITUNG-ERINNERUNG.md).
# Manuell lässt sich eine Web-Push-Nachricht weiter senden.
on:
  workflow_dispatch:
    inputs:
      erzwingen:
        description: 'Sofort senden, ohne Prüfung der Uhrzeit'
        type: boolean
        default: false

jobs:
  erinnerung:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: cd tools && npm install --omit=dev

      - name: Erinnerung senden
        run: cd tools && node push.mjs
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_ABO: ${{ secrets.PUSH_ABO }}
          ERZWINGEN: ${{ inputs.erzwingen && '1' || '0' }}
