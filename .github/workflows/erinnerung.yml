name: Erinnerung 22 Uhr

on:
  schedule:
    # UTC 19:50 = 21:50 Berlin im Sommer, 20:50 = 21:50 im Winter. tools/push.mjs prüft das Fenster und wartet bis 22:00.
    - cron: '50 19 * * *'
    - cron: '50 20 * * *'
  workflow_dispatch:
    inputs:
      erzwingen:
        description: 'Sofort senden, ohne Prüfung der Uhrzeit'
        type: boolean
        default: false

jobs:
  erinnerung:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: cd tools && npm install --omit=dev

      - name: Erinnerung senden
        run: cd tools && node push.mjs
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_ABO: ${{ secrets.PUSH_ABO }}
          ERZWINGEN: ${{ inputs.erzwingen && '1' || '0' }}
